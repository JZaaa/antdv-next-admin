name: Build

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@v6.1.0
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: "pnpm"
          cache-dependency-path: "pnpm-lock.yaml"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Chrome 100 source and configuration checks
        run: pnpm run check:compat

      - name: Type check
        run: pnpm run type-check

      - name: Lint
        run: pnpm run lint

      - name: Unit tests (excluding forms)
        run: pnpm run test:unit:run --exclude '**/*form*.spec.ts'

      - name: Build
        run: pnpm run build

      - name: Check production CSS compatibility
        run: pnpm run check:compat:dist

      - name: Build Demo
        run: pnpm run build:demo

      - name: Check Demo CSS compatibility
        run: pnpm run check:compat:dist
