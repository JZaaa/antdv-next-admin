<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Antdv Next Admin</title>
    <meta name="app-storage-namespace" content="%APP_STORAGE_NAMESPACE%" />
    <script>
      // GitHub Pages SPA 路由重定向解决方案
      // 将路径信息存储到 sessionStorage，然后重定向到首页
      try {
        var namespace = document.querySelector('meta[name="app-storage-namespace"]').content;
        sessionStorage.setItem(namespace + 'redirect', location.href);
      } catch (_) {
        // Continue to the homepage even when session storage is disabled.
      }
    </script>
    <meta http-equiv="refresh" content="0;URL='/'" />
  </head>
  <body>
    <p>Redirecting...</p>
  </body>
</html>
